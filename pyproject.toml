[project]
name = "ha-record-suite"
version = "1.1.0"
description = "Home Assistant custom components: health, asset, note, and finance records"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
